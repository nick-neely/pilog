name: Deploy Site — Production

# Deploys pilog.dev for site-only changes that do not require a desktop app
# release. Release workflows still deploy the site after updating the release
# manifest, so this workflow excludes that generated manifest on push.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '!site/src/data/release-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  deploy-site:
    name: Deploy Site — Vercel Production
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build for Vercel
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
