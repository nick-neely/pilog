name: Deploy Site — Production

# Deploys pilog.dev for site-only changes that do not require a desktop app
# release. Release workflows still deploy the site after updating the release
# manifest, so this workflow excludes that generated manifest on push.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '!site/src/data/release-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-site:
    name: Deploy Site — Vercel Production
    uses: ./.github/workflows/deploy-site-reusable.yml
    with:
      checkout-ref: main
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
