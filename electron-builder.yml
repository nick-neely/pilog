appId: dev.pilog.app
productName: Pilog
directories:
  app: app
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!**/.DS_Store'
  - '!**/Thumbs.db'
  - '!**/{test,tests,__tests__,fixtures,__fixtures__,coverage,.nyc_output,.cache,.vite,.turbo}/**'
  - '!**/*.{test,spec}.{js,jsx,cjs,mjs,ts,tsx,cts,mts}'
extraResources:
  - from: resources/icon.png
    to: resources/icon.png
  - from: resources/tray-icon.png
    to: resources/tray-icon.png
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@vscode/ripgrep/bin/**'
  - resources/**
afterPack: ./scripts/verify-packaged-runtime.cjs
publish:
  provider: github
  owner: nick-neely
  repo: pilog
  channel: latest
  releaseType: release
win:
  executableName: Pilog
nsis:
  artifactName: Pilog-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Pilog-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: pilog
  maintainer: Nick Neely
  category: Development
appImage:
  artifactName: Pilog-${version}.${ext}
deb:
  artifactName: Pilog-${version}.${ext}
npmRebuild: true
