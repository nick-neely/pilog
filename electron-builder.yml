appId: dev.pilog.app
productName: Pilog
directories:
  app: app
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: resources/icon.png
  - from: resources/tray-icon.png
    to: resources/tray-icon.png
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@vscode/ripgrep/bin/**'
  - resources/**
publish:
  provider: github
  owner: nick-neely
  repo: pilog
  channel: latest
  releaseType: release
win:
  executableName: Pilog
nsis:
  artifactName: Pilog-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Pilog-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  executableName: pilog
  maintainer: Nick Neely
  category: Development
appImage:
  artifactName: Pilog-${version}.${ext}
npmRebuild: true
